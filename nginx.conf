server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Compress the text-ish payloads (js / css / svg + a couple of friends).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/css
        text/plain
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Vite's hashed bundles: safe to hold for a year, they never change under a name.
    location /assets/ {
        # 1y (= 31536000s) + immutable, as a single Cache-Control header
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # HTML always revalidates, so a deploy reaches every kid right away.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    # Single-page app: anything unknown falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Container health check.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
